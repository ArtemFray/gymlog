<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>GymLog</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#121110">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GymLog">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<script>
try {
  var st = JSON.parse(localStorage.getItem('gymlog.v1') || 'null');
  var th = st && st.settings && st.settings.theme === 'light' ? 'light' : 'dark';
  document.documentElement.dataset.theme = th;
  document.querySelector('meta[name="theme-color"]').content = th === 'light' ? '#f4f2ed' : '#121110';
} catch (e) {}
</script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="shell">
  <header>
    <h1 id="title">GymLog</h1>
    <span class="elapsed" id="elapsed"></span>
    <button class="hbtn" id="btn-settings" aria-label="Settings"><svg viewBox="0 0 18 18" aria-hidden="true"><circle cx="9" cy="9" r="6.3" stroke-width="2.2" stroke-dasharray="2.3 2.65"/><circle cx="9" cy="9" r="4.7"/><circle cx="9" cy="9" r="1.7"/></svg></button>
  </header>
  <main id="app"></main>
  <nav id="nav"></nav>
</div>
<div id="overlay"></div>

<script src="data.js"></script>
<script src="info.js"></script>
<script src="store.js"></script>
<script src="views.js"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
</body>
</html>
