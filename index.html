<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>GymLog</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0e0f13">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GymLog">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --bg:#0e0f13; --bg2:#171922; --bg3:#1e2130; --line:#2a2e3f;
  --fg:#eef0f6; --fg2:#9aa1b8; --fg3:#6c7390;
  --acc:#5b8cff; --acc2:#3f6fe0; --ok:#3ecf8e; --warn:#ffb020; --bad:#ff5d5d;
  --radius:14px;
}
html[data-theme="light"]{
  --bg:#f5f6fa; --bg2:#ffffff; --bg3:#eceef5; --line:#dde0ea;
  --fg:#12141c; --fg2:#5b6178; --fg3:#8b90a5;
  --acc:#2f63e0; --acc2:#22499f; --ok:#12915d; --warn:#a86200; --bad:#c62828;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--fg);
  font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  overscroll-behavior-y:none;}
body{padding-bottom:calc(64px + env(safe-area-inset-bottom));}
body.resting{padding-bottom:calc(112px + env(safe-area-inset-bottom));}
button,input,select,textarea{font-family:inherit;font-size:16px;color:inherit}
button{cursor:pointer;border:none;background:none;padding:0}
a{color:var(--acc)}

/* header */
header{position:sticky;top:0;z-index:20;background:var(--bg);
  padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:10px;}
header h1{font-size:20px;margin:0;font-weight:700;letter-spacing:-.2px;flex:1}
header .hbtn{width:36px;height:36px;border-radius:10px;background:var(--bg3);display:grid;place-items:center;font-size:17px}

main{padding:14px 16px 24px;max-width:680px;margin:0 auto}

/* nav */
nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--bg2);
  border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:8px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:3px;
  color:var(--fg3);font-size:10px;font-weight:600;letter-spacing:.1px}
nav button .ic{font-size:19px;line-height:1}
nav button.on{color:var(--acc)}

/* building blocks */
.card{background:var(--bg2);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:12px}
.card.tight{padding:10px 12px}
.row{display:flex;align-items:center;gap:10px}
.row.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.muted{color:var(--fg2)}
.dim{color:var(--fg3)}
.small{font-size:13px}
.tiny{font-size:11px;letter-spacing:.3px;text-transform:uppercase;color:var(--fg3);font-weight:700}
.big{font-size:26px;font-weight:700;letter-spacing:-.5px}
.mono{font-variant-numeric:tabular-nums}
h2{font-size:15px;margin:20px 0 10px;font-weight:700;color:var(--fg2);letter-spacing:.2px}
h2:first-child{margin-top:0}
hr{border:none;border-top:1px solid var(--line);margin:12px 0}

.btn{background:var(--acc);color:#fff;border-radius:12px;padding:13px 16px;font-weight:650;
  text-align:center;display:block;width:100%}
.btn.sec{background:var(--bg3);color:var(--fg)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--fg)}
.btn.danger{background:transparent;border:1px solid var(--bad);color:var(--bad)}
.btn.sm{padding:9px 12px;font-size:14px;width:auto;border-radius:10px}
.btn:active{opacity:.75}
.chip{background:var(--bg3);border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-size:13px;font-weight:600;color:var(--fg2);white-space:nowrap}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}

input[type=text],input[type=number],input[type=date],select,textarea{
  width:100%;background:var(--bg3);border:1px solid var(--line);border-radius:10px;
  padding:11px 12px;color:var(--fg);outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--acc)}
textarea{resize:vertical;min-height:64px}
label.f{display:block;margin-bottom:10px}
label.f > span{display:block;font-size:12px;color:var(--fg2);margin-bottom:5px;font-weight:600}

.sw{position:relative;width:46px;height:28px;border-radius:99px;background:var(--bg3);border:1px solid var(--line);flex:none;transition:.15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--fg2);transition:.15s}
.sw.on{background:var(--acc);border-color:var(--acc)}
.sw.on::after{left:21px;background:#fff}

.list{border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:var(--bg2)}
.item{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.item:last-child{border-bottom:none}
.item:active{background:var(--bg3)}
.badge{font-size:10px;font-weight:700;padding:3px 7px;border-radius:6px;background:var(--bg3);color:var(--fg2);text-transform:uppercase;letter-spacing:.3px;white-space:nowrap}
.badge.warn{background:rgba(255,176,32,.15);color:var(--warn)}
.badge.acc{background:rgba(91,140,255,.15);color:var(--acc)}
.badge.ok{background:rgba(62,207,142,.15);color:var(--ok)}

.note{background:rgba(255,176,32,.1);border:1px solid rgba(255,176,32,.35);color:var(--warn);
  border-radius:10px;padding:9px 11px;font-size:13px;line-height:1.35;margin:8px 0}
.note.ok{background:rgba(62,207,142,.1);border-color:rgba(62,207,142,.35);color:var(--ok)}
.note.info{background:rgba(91,140,255,.1);border-color:rgba(91,140,255,.3);color:var(--acc)}

/* set rows */
.setrow,.sethead{display:grid;grid-template-columns:22px 52px 1fr 1fr 40px 24px;gap:6px;align-items:center}
.setrow{margin-bottom:7px}
.sethead{margin-bottom:5px}
.setrow input{padding:10px 6px;text-align:center;font-variant-numeric:tabular-nums;font-weight:600}
.setrow .idx{text-align:center;color:var(--fg3);font-weight:700;font-size:13px}
.setrow .prev{font-size:10.5px;color:var(--fg3);text-align:center;line-height:1.15;overflow:hidden}
.setrow .del{color:var(--fg3);font-size:20px;text-align:center;line-height:1}
.setrow .tick{border-radius:9px;background:var(--bg3);border:1px solid var(--line);height:40px;display:grid;place-items:center;font-size:15px;color:var(--fg3)}
.setrow .tick.on{background:var(--ok);border-color:var(--ok);color:#04120b}
.sethead div{font-size:10px;text-transform:uppercase;letter-spacing:.4px;color:var(--fg3);text-align:center;font-weight:700}

/* sheet / modal */
.sheet{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;
  animation:fade .15s ease}
.sheet .inner{background:var(--bg2);width:100%;max-height:88vh;overflow-y:auto;border-radius:18px 18px 0 0;
  padding:16px 16px calc(20px + env(safe-area-inset-bottom));animation:up .2s ease;max-width:680px;margin:0 auto}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet h3{margin:0 0 12px;font-size:18px}
.grabber{width:38px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}

/* rest timer bar */
#restbar{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom));z-index:25;
  background:var(--acc);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:12px;font-weight:650}
#restbar .t{font-variant-numeric:tabular-nums;font-size:19px;min-width:56px}
#restbar button{color:#fff;background:rgba(255,255,255,.2);border-radius:8px;padding:6px 10px;font-size:13px;font-weight:700}

.fab{position:fixed;right:16px;bottom:calc(78px + env(safe-area-inset-bottom));z-index:25;
  background:var(--acc);color:#fff;border-radius:99px;padding:14px 20px;font-weight:700;
  box-shadow:0 6px 20px rgba(0,0,0,.35)}

svg.chart{width:100%;display:block;overflow:visible}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--fg2);margin-top:6px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:middle}

.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.kpi{background:var(--bg2);border:1px solid var(--line);border-radius:var(--radius);padding:12px}
.kpi .v{font-size:22px;font-weight:700;letter-spacing:-.4px;font-variant-numeric:tabular-nums}
.kpi .k{font-size:11px;color:var(--fg3);text-transform:uppercase;letter-spacing:.3px;font-weight:700;margin-top:2px}
.empty{text-align:center;color:var(--fg3);padding:28px 10px;font-size:14px}
.bar{height:8px;border-radius:4px;background:var(--bg3);overflow:hidden}
.bar > i{display:block;height:100%;background:var(--acc)}
</style>
</head>
<body>
<header>
  <h1 id="title">GymLog</h1>
  <button class="hbtn" id="btn-settings" aria-label="Settings">⚙</button>
</header>
<main id="app"></main>
<nav id="nav"></nav>
<div id="overlay"></div>

<script src="data.js"></script>
<script src="store.js"></script>
<script src="views.js"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
</body>
</html>
